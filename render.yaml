services:
  - type: web
    name: meeting-minutes-app
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: commit

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: REQUIRE_PERSISTENT_DB
        value: "true"

      - key: APP_ADMIN_EMAIL
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: APP_ADMIN_NAME
        value: 관리자

      - key: PLAUD_WEBHOOK_SECRET
        sync: false

      - key: OPENAI_TRANSLATION_MODEL
        value: gpt-5.6-luna

      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
